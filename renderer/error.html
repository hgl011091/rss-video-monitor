<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>加载错误 - RSS视频监控</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f1f5f9; display: flex; align-items: center; justify-content: center; height: 100vh; }
    .container { text-align: center; padding: 40px; max-width: 400px; }
    .icon { width: 80px; height: 80px; margin: 0 auto 24px; background: linear-gradient(135deg, #ef4444 0%, #f97316 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    h1 { font-size: 24px; font-weight: 600; margin-bottom: 12px; }
    p { color: #94a3b8; line-height: 1.6; margin-bottom: 24px; }
    .details { background: #1e293b; padding: 16px; border-radius: 8px; font-size: 12px; text-align: left; font-family: 'JetBrains Mono', monospace; color: #64748b; }
    button { padding: 12px 24px; background: #6366f1; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #4f46e5; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
    </div>
    <h1>页面加载失败</h1>
    <p>渲染进程无法启动，请尝试重新安装或联系技术支持。</p>
    <div class="details" id="errorDetails">等待错误信息...</div>
    <button onclick="location.reload()">重试</button>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const error = params.get('error') || '未知错误';
    document.getElementById('errorDetails').textContent = '错误: ' + decodeURIComponent(error);
  </script>
</body>
</html>
